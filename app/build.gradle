plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fastjobmx.teleprompter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fastjobmx.teleprompter'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        versionName "3.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        // El modelo de voz ya viene comprimido
        noCompress += ['tgz']
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    def media3 = '1.11.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation "androidx.media3:media3-transformer:$media3"
    implementation "androidx.media3:media3-effect:$media3"
    implementation "androidx.media3:media3-common:$media3"
}
