name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar la app web al APK
        run: |
          mkdir -p app/src/main/assets/www
          cp web/index.html web/manifest.webmanifest web/icon-*.png web/vosk.js app/src/main/assets/www/
          cp -r web/fonts app/src/main/assets/www/

      - name: Descargar modelo de voz en español (Vosk, sin internet)
        run: |
          curl -sSL --retry 3 -o es.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q es.zip
          mv vosk-model-small-es-0.42 model
          tar czf app/src/main/assets/www/model.tgz model
          ls -la app/src/main/assets/www/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Teleprompter.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Teleprompter 3.0.${{ github.run_number }}
          body: |
            Descarga **Teleprompter.apk** desde el celular e instálalo.
            Novedades: subtítulos estilo redes (7 estilos palabra por palabra), selección de micrófono externo (USB, inalámbrico, Bluetooth), grabación por partes y edición con efectos.
          files: Teleprompter.apk
          make_latest: true

      - name: Publicar registro si falla
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Registro de compilación (error)
          prerelease: true
          files: build.log
